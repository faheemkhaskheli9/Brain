<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Lab</title>
<style>
  /* Palette from game/levels.py: a stained histology slide (glass, cresyl violet, eosin pink) */
  :root { --glass: #F7F2F6; --lilac: #E6DCEE; --muted: #6F6890; --violet: #5B3A8C; --pink: #D9637E; --ink: #2A2550; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--glass); color: var(--ink);
         font: 16px/1.5 Bahnschrift, "DIN Alternate", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  nav a { padding: 4px 10px; text-decoration: none; background: var(--lilac); }
  nav a[aria-current] { background: var(--violet); color: var(--glass); }
  h1 { font-weight: 600; font-size: 1.75rem; margin: 0 0 4px; }
  .intro { font-family: Cambria, Georgia, serif; line-height: 1.6; max-width: 68ch; margin: 0 0 20px; }
  .play { display: flex; gap: 20px; flex-wrap: wrap; }
  canvas { flex: 1 1 520px; width: 100%; max-width: 660px; aspect-ratio: 3 / 2; border: 1px solid var(--lilac);
           background: var(--glass); cursor: crosshair; touch-action: manipulation; }
  aside { flex: 0 1 270px; }
  .goal { font-weight: 600; }
  #status { white-space: pre-line; min-height: 5.5em; }
  #hint { color: var(--violet); font-size: .875rem; }
  button { font: inherit; color: var(--ink); background: var(--lilac); border: 0; padding: 8px 14px; margin: 4px 0;
           cursor: pointer; width: 100%; }
  button:hover, button:focus-visible { background: var(--violet); color: var(--glass); }
  button:focus-visible, canvas:focus-visible, nav a:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: wait; }
  button[aria-pressed="false"]::before { content: "☐  "; }
  button[aria-pressed="true"]::before { content: "☑  "; }
  .tag { font-size: .8125rem; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; max-width: 68ch; }
  .tag b { color: var(--violet); text-transform: uppercase; }
  .debrief { font-family: Cambria, Georgia, serif; line-height: 1.6; max-width: 68ch; }
  a { color: var(--violet); }
</style>
</head>
<body>
<main>
  <nav aria-label="Levels"><a href="#spark">1 Spark</a><a href="#wire">2 Wire together</a><a href="#lesion">3 Lesion lab</a><a href="#dopamine">4 Be the dopamine</a><a href="#remember">5 Remember me</a><a href="#sleep">6 Sleep on it</a><a href="#predict">7 Guess what's next</a><a href="#tiny">8 Tiny brain</a><a href="#pattern">9 Find the pattern</a><a href="#zoo">10 Neuron zoo</a><a href="#home">11 Find your way home</a></nav>
  <h1 id="title"></h1>
  <p class="tag" id="tag"></p>
  <p class="intro" id="intro"></p>
  <div class="play">
    <canvas id="slide" width="660" height="440" tabindex="0"></canvas>
    <aside>
      <p class="goal" id="goal"></p>
      <div id="controls"><button disabled>Loading the model…</button></div>
      <button id="again" hidden>Try again</button>
      <p id="status" role="status"></p>
      <p id="hint" hidden></p>
    </aside>
  </div>
  <p class="debrief" id="debrief" hidden></p>
</main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
// All 11 Brain Lab levels in the browser. The models are game/sim.py, run by Pyodide;
// this file only mirrors each levels.py class's text, clock, drawing and win check.
const W = 660, H = 440, TICK_MS = 20, HINT_AFTER_MS = 45000;
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const $ = id => document.getElementById(id);
const ctx = $("slide").getContext("2d");
const font = px => `${px}px Bahnschrift, system-ui, sans-serif`;
const pct = v => `${Math.round(v * 100)}%`;
let py, sim, level, over, hintTimer;

function text(s, x, y, align = "center", color = "--muted", px = 13) {
  ctx.font = font(px); ctx.fillStyle = css(color); ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.fillText(s, x, y);
}
function line(x1, y1, x2, y2, color, width = 1, dash = []) {
  ctx.strokeStyle = css(color); ctx.lineWidth = width; ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
}
function arrow(x1, y1, x2, y2, color, width, dash = []) {
  line(x1, y1, x2, y2, color, width, dash);
  const a = Math.atan2(y2 - y1, x2 - x1), head = 4 * width;
  ctx.fillStyle = css(color); ctx.beginPath(); ctx.moveTo(x2, y2);
  for (const s of [-1, 1]) ctx.lineTo(x2 - head * Math.cos(a + s * 0.4), y2 - head * Math.sin(a + s * 0.4));
  ctx.fill();
}
function circle(x, y, r, fill, stroke, width = 1, dash = []) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI);
  if (fill) { ctx.fillStyle = css(fill); ctx.fill(); }
  if (stroke) { ctx.strokeStyle = css(stroke); ctx.lineWidth = width; ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
}
function slider(id, label, min, max, step, value) {
  const l = Object.assign(document.createElement("label"), { htmlFor: id, textContent: label });
  const i = Object.assign(document.createElement("input"), { id, type: "range", min, max, step, value, disabled: !sim });
  i.style.width = "100%";
  return [l, i];
}
const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
// A returned numpy array or tuple as a plain JS array, with its proxy freed.
const js = p => { const v = p.toJs(); p.destroy(); return Array.from(v); };
function say(s) { $("status").textContent = s; }
const stars = n => "★".repeat(n) + "☆".repeat(3 - n);

function end(msg, won) {
  over = true; clearTimeout(hintTimer); $("again").hidden = false;
  for (const b of $("controls").children) b.disabled = true;
  say(msg); render();
  if (won) $("debrief").hidden = false; else $("hint").hidden = false;
}

const LEVELS = {
  spark: {
    title: "Spark",
    goal: "Fire exactly 5 spikes before the 500 ms window ends.",
    intro: "A neuron adds up the charge that flows onto its membrane. When the voltage reaches threshold it fires " +
      "a spike, drops below its resting level and is silent for a moment. Charge also leaks away, so input that " +
      "arrives slowly never adds up. Each click (or Space) sends a 10 ms pulse of current into this model neuron. " +
      "Time runs 20 times slower than real so you can watch it.",
    debrief: "You used temporal summation: pulses that arrive close together add up before the leak drains them " +
      "away. Too many in a row and the neuron keeps firing. This is the leaky integrate-and-fire model, the " +
      "workhorse of spiking simulations. Real neurons add ion-channel detail (Hodgkin-Huxley), but threshold, " +
      "leak and reset are the core.",
    kb: ["simulation/spiking-neural-networks.md", "spiking neural networks"],
    hint: "One click stays below threshold. Two quick clicks fire one spike, so send 5 pairs spread out.",
    label: "Membrane voltage plot. Click or press Space to inject current.",
    buttons: [["Inject current (Space)", "Space", s => s.click()]],
    WINDOW: 500,
    x(ms) { return 60 + ms * (W - 110) / this.WINDOW; },
    y(v) { return H - 50 - (v + 80) * (H - 100) / 45; },
    reset() {
      Object.assign(this, { neuron: sim.LIF(), t: 0, pulses: [], clicks: 0, spikes: 0, points: [[0, sim.V_REST]] });
      say("Waiting for your first click.");
    },
    canvasClick() { this.click(); },
    click() { this.pulses.push(10); this.clicks += 1; },
    tick() {
      if (!this.clicks) return;
      const current = 2.0 * this.pulses.length;
      this.pulses = this.pulses.filter(p => p > 1).map(p => p - 1);
      this.t += 1;
      if (this.neuron.step(current, 1.0)) { this.spikes += 1; this.points.push([this.t, -40]); }
      this.points.push([this.t, this.neuron.v]);
      say(`Spikes  ${this.spikes} of 5\nClicks  ${this.clicks}\nTime  ${this.t} ms`);
      if (this.spikes > 5) {
        end(`${this.spikes} spikes. While the current stays high the neuron keeps firing, so stop clicking once you are close.`);
      } else if (this.t >= this.WINDOW) {
        if (this.spikes === 5) {
          end(`Won: 5 spikes from ${this.clicks} clicks. ${stars(this.clicks <= 10 ? 3 : this.clicks <= 15 ? 2 : 1)}`, true);
        } else {
          end(`${this.spikes} spikes. Click in quick bursts: pulses close together add up before the charge leaks away.`);
        }
      }
    },
    draw() {
      for (const [v, label, dash] of [[sim.V_TH, "threshold  -55 mV", [6, 4]], [sim.V_REST, "rest  -70 mV", [2, 4]]]) {
        line(60, this.y(v), W - 20, this.y(v), "--muted", 1, dash);
        text(label, W - 20, this.y(v) - 10, "right");
      }
      for (let ms = 0; ms <= this.WINDOW; ms += 100) text(`${ms} ms`, this.x(ms), H - 22);
      text("Click anywhere on the slide to inject current", W / 2, 24, "center", "--muted", 15);
      ctx.strokeStyle = css("--violet"); ctx.lineWidth = 2; ctx.beginPath();
      this.points.forEach(([t, v], i) => i ? ctx.lineTo(this.x(t), this.y(v)) : ctx.moveTo(this.x(t), this.y(v)));
      ctx.stroke();
      for (const [t, v] of this.points) if (v === -40) line(this.x(t), this.y(sim.V_TH), this.x(t), this.y(-40), "--pink", 4);
    },
  },

  wire: {
    title: "Wire together",
    goal: "Make synapse A stronger than 0.8 and synapse B weaker than 0.2.",
    intro: "Synapses change strength with use. In spike-timing-dependent plasticity (STDP), timing decides the " +
      "direction. An input that fires just before the output neuron gets stronger; one that fires just after gets " +
      "weaker. The window is about 20 ms. You are the experimenter. Press A or B to fire an input and Space to " +
      "make the output neuron fire. Time runs 10 times slower than real.",
    debrief: "Pre before post strengthens, because the input may have caused the spike. Post before pre weakens. " +
      "Both inputs share one output neuron, so a badly timed output spike changes both synapses at once. STDP lets " +
      "neurons learn causal order and pick up repeating patterns without a teacher (Markram et al. 1997; Bi and " +
      "Poo 1998).",
    kb: ["function/learning-and-plasticity.md", "learning and plasticity"],
    hint: "Repeat A, then Space, then B, all quickly, and wait a second between rounds so the traces fade.",
    label: "Spike raster of inputs A, B and the output, with bars for the two synapse strengths. Press A, B or Space.",
    buttons: [["Fire input A (A)", "KeyA", s => s.fire(0)], ["Fire input B (B)", "KeyB", s => s.fire(1)],
              ["Fire output (Space)", "Space", s => s.fire(2)]],
    DT: 2.0, SPAN: 400.0,  // model ms per tick, ms shown on the raster
    ROWS: [["Input A", 90], ["Input B", 170], ["Output", 250]],
    wy: w => 360 - w * 300,
    weights() { const p = this.syn.w, w = Array.from(p.toJs()); p.destroy(); return w; },
    reset() {
      if (this.syn) this.syn.destroy();
      Object.assign(this, { syn: sim.STDP(2), t: 0, events: [], presses: 0 });
      say("A 0.50   B 0.50\n\nFire an input, then the output a moment later.");
    },
    canvasClick() {},
    fire(who) {
      const before = this.weights();
      who === 2 ? this.syn.post() : this.syn.pre(who);
      this.events.push([this.t, who]);
      this.presses += 1;
      const [a, b] = this.weights();
      const changes = [a, b].map((w, i) => [("AB")[i], w - before[i]]).filter(([, d]) => Math.abs(d) >= 0.005)
        .map(([n, d]) => `${n} ${d >= 0 ? "+" : ""}${d.toFixed(2)}`).join(", ");
      const msg = `A ${a.toFixed(2)}   B ${b.toFixed(2)}\n\nLast spike: ${changes || "no change (nothing within ~20 ms)"}\nPresses ${this.presses}`;
      say(msg);
      if (a > 0.8 && b < 0.2) {
        end(`Won in ${this.presses} presses. ${stars(this.presses <= 14 ? 3 : this.presses <= 24 ? 2 : 1)}\n\n${msg}`, true);
      }
    },
    tick() { this.t += this.DT; this.syn.decay(this.DT); },
    draw() {
      const x = t => 470 - (this.t - t) * 370 / this.SPAN;
      ctx.fillStyle = css("--lilac");
      for (const [t, who] of this.events) if (who === 2 && this.t - t <= this.SPAN) ctx.fillRect(x(t - 20), 70, 20 * 370 / this.SPAN, 120);
      for (const [label, y] of this.ROWS) { text(label, 20, y, "left", "--ink", 15); line(100, y, 470, y, "--lilac"); }
      for (const [t, who] of this.events) {
        if (this.t - t > this.SPAN) continue;
        const y = this.ROWS[who][1];
        line(x(t), y - 18, x(t), y + 18, who === 2 ? "--pink" : "--violet", 3);
      }
      text(`last ${this.SPAN} ms, newest on the right`, 285, 300);
      text("Shaded band: the 20 ms before each output spike. Inputs inside it get stronger.", 285, 330, "center", "--muted", 12);
      const w = this.weights();
      [540, 610].forEach((xc, i) => {
        ctx.fillStyle = css("--violet"); ctx.fillRect(xc - 17, this.wy(w[i]), 34, 359 - this.wy(w[i]));
        ctx.strokeStyle = css("--muted"); ctx.lineWidth = 1; ctx.strokeRect(xc - 18, 60, 36, 300);
        text("AB"[i], xc, 380, "center", "--ink", 16);
      });
      line(510, this.wy(0.8), 640, this.wy(0.8), "--violet", 1, [4, 3]);
      line(510, this.wy(0.2), 640, this.wy(0.2), "--pink", 1, [4, 3]);
      text("synapse strength", 575, 40);
    },
  },

  lesion: {
    title: "Lesion lab",
    goal: "Lesion each hidden region and name it from what breaks. At most 3 wrong names.",
    intro: "Much of what we know about brain regions comes from damage. When a stroke, an injury or surgery takes " +
      "out one part, the behaviour that breaks shows what that part was doing. This brain does 8 jobs. Its regions " +
      "are hidden. Click a region (or press its number, 1 to 8) to lesion it and watch which job fails, then name " +
      "the region. Lesioning another region heals the first one.",
    debrief: "Each lesion took out one kind of learner. Losing the hippocampus stops new episodes but spares old " +
      "memories, because those have moved to the cortex. Losing the basal ganglia stops habits forming while the " +
      "memory of practising survives: two memory systems, broken separately. A brain-like AI would need several " +
      "kinds of learner, not one big network.",
    kb: ["anatomy/brain-structure-overview.md", "brain structure overview"],
    hint: "Match the broken job to a role: memory of places is the hippocampus, fear is the amygdala, timing is the cerebellum.",
    label: "A brain with 8 hidden regions, numbered 1 to 8. Click one or press its number to lesion it.",
    // Each entry of sim.REGIONS: [[x, y], job, role, deficit, evidence]. Name buttons are shuffled, as on desktop.
    get buttons() {
      if (!sim) return [["Loading the model…", null, () => {}]];
      this.R = this.R || sim.REGIONS.toJs();
      return [...this.R.keys()].sort(() => Math.random() - 0.5).map(n => [n, null, s => s.name(n)]);
    },
    reset() {
      Object.assign(this, { cut: null, named: new Set(), mistakes: 0 });
      say("Click a hidden region on the slide to lesion it.");
    },
    hit(x, y) { return [...this.R].find(([, [[cx, cy]]]) => Math.abs(x - cx) <= 80 && Math.abs(y - cy) <= 17)?.[0]; },
    canvasClick(x, y) { const n = this.hit(x, y); if (n) this.lesion(n); },
    key(e) { const k = +e.key; if (k >= 1 && k <= this.R.size) this.lesion([...this.R.keys()][k - 1]); },
    lesion(n) {
      this.cut = n;
      say(`Lesioned.\n\n${this.R.get(n)[3]}` + (this.named.has(n) ? "" : "\n\nWhich region is it?"));
    },
    name(guess) {
      if (this.cut === null || this.named.has(this.cut)) return say("Lesion a region you have not named yet, then pick its name.");
      const cut = this.cut;
      if (guess !== cut) {
        this.mistakes += 1;
        const msg = `Not quite. ${guess} does ${this.R.get(guess)[2]}.\nWrong names ${this.mistakes} of 3`;
        return this.mistakes > 3 ? end(msg) : say(msg);
      }
      this.named.add(cut); this.cut = null;
      for (const b of $("controls").children) if (b.textContent === cut) b.disabled = true;
      const msg = `Yes. ${cut}: ${this.R.get(cut)[2]}.\nEvidence: ${this.R.get(cut)[4]}.`;
      if (this.named.size === this.R.size) return end(`Won. ${stars(3 - Math.min(this.mistakes, 2))}\n\n${msg}`, true);
      say(msg);
    },
    tick() {},
    draw() {
      ctx.fillStyle = css("--lilac"); ctx.strokeStyle = css("--muted"); ctx.lineWidth = 2;
      ctx.fillRect(350, 330, 60, 90); ctx.strokeRect(350, 330, 60, 90);
      ctx.beginPath(); ctx.ellipse(335, 200, 285, 150, 0, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
      text("front", 70, 30, "left", "--muted", 12); text("back", 600, 30, "right", "--muted", 12);
      [...this.R].forEach(([n, [[x, y]]], i) => {
        ctx.fillStyle = css(n === this.cut ? "--pink" : this.named.has(n) ? "--lilac" : "--glass");
        ctx.fillRect(x - 80, y - 17, 160, 34);
        ctx.strokeStyle = css("--violet"); ctx.strokeRect(x - 80, y - 17, 160, 34);
        text(this.named.has(n) ? n : `${i + 1}  ?`, x, y, "center", "--ink", n.length > 20 && this.named.has(n) ? 11 : 13);
      });
      const broken = this.cut && this.R.get(this.cut)[1];
      text(broken ? "7 of 8 jobs work. Broken:" : "All 8 jobs work.", 16, 372, "left", broken ? "--pink" : "--ink", 14);
      if (!broken) return;
      // Wrap at 270 px, as on desktop, so the job stays left of the brainstem box.
      ctx.font = font(13);
      let row = "✗", y = 394;
      for (const w of broken.split(" ")) {
        if (ctx.measureText(`${row} ${w}`).width > 270) { text(row, 16, y, "left", "--pink"); row = w; y += 18; }
        else row += ` ${w}`;
      }
      text(row, 16, y, "left", "--pink");
    },
  },

  dopamine: {
    title: "Be the dopamine",
    goal: "Make the dopamine burst move from the juice to the bell. Then withhold the juice and cause a dip.",
    intro: "Dopamine neurons do not signal reward itself. They signal reward prediction error: a burst when things " +
      "are better than expected, nothing when they are as expected, a dip when they are worse. A temporal-difference " +
      "(TD) learner computes the same signal, δ = r + γV(s′) − V(s). Each button runs one trial. The bars show the " +
      "learner's dopamine at each moment.",
    debrief: "Once the bell predicts the juice, the surprise, and the burst, moves to the bell. Missing juice is worse " +
      "than predicted, so dopamine dips at the moment the juice was due. Juice with no bell is still a surprise. Real " +
      "dopamine neurons do all three (Schultz, Dayan and Montague 1997), one of the strongest links between " +
      "neuroscience and AI.",
    kb: ["function/learning-and-plasticity.md", "learning and plasticity"],
    hint: "Run bell-and-juice trials until the bell bar is tall and the juice bar is gone, then ring with no juice.",
    label: "Bar chart of the learner's dopamine at each moment of the last trial, with a line chart across trials.",
    buttons: [["Ring bell, give juice", null, s => s.trial(true, true)], ["Ring bell, no juice", null, s => s.trial(true, false)],
              ["Juice, no bell", null, s => s.trial(false, true)]],
    ZERO: 160, SCALE: 100, X0: 70, STEP: 52,
    reset() {
      if (this.V) this.V.destroy();
      Object.assign(this, { V: sim.td_values(), trials: 0, learned: false, surprise: false, history: [],
                            d: new Array(sim.T_JUICE + 3).fill(0), bell: null, juice: null });
      say("Run a trial to see the dopamine response.");
    },
    canvasClick() {},
    trial(bell, juice) {
      const p = sim.td_trial(this.V, bell, juice), d = Array.from(p.toJs()); p.destroy();
      Object.assign(this, { d, bell, juice });
      this.trials += 1;
      const db = d[sim.T_BELL], dj = d[sim.T_JUICE], f = v => `${v >= 0 ? "+" : ""}${v.toFixed(2)}`;
      this.history.push([db, dj]);
      let msg = `Trial ${this.trials}\nDopamine at bell  ${f(db)}\nDopamine at juice time  ${f(dj)}`;
      if (bell && juice && db >= 0.8 && dj <= 0.2 && !this.learned) {
        this.learned = true;
        msg += "\n\nThe burst has moved to the bell. Now try a trial without juice.";
      } else if (this.learned && !bell && juice) {
        this.surprise = true;
      }
      if (this.learned && bell && !juice && dj <= -0.5) {
        return end(`Won. ${stars(1 + this.surprise + (this.trials <= 25))}\n\n${msg}\n\nA dip: the predicted juice never came.`, true);
      }
      say(msg);
    },
    tick() {},
    draw() {
      line(40, this.ZERO, W - 30, this.ZERO, "--muted");
      text("dopamine (TD error) this trial", 40, 30, "left", "--muted", 12);
      this.d.forEach((v, t) => {
        if (Math.abs(v) <= 1e-3) return;
        const x = this.X0 + t * this.STEP, y = this.ZERO - v * this.SCALE;
        ctx.fillStyle = css(v > 0 ? "--pink" : "--violet");
        ctx.fillRect(x - 14, Math.min(y, this.ZERO), 28, Math.abs(v) * this.SCALE);
      });
      for (const [t, label, on] of [[sim.T_BELL, "bell", this.bell], [sim.T_JUICE, "juice", this.juice]]) {
        text(label, this.X0 + t * this.STEP, this.ZERO + this.SCALE + 20, "center", on ? "--ink" : "--muted", 15);
      }
      const top = 340, bot = 430, mid = (top + bot) / 2;
      text("across trials:  at bell (violet), at juice time (pink)", 40, top - 14, "left", "--muted", 12);
      line(40, mid, W - 30, mid, "--lilac");
      if (this.history.length < 2) return;
      const n = Math.max(this.history.length - 1, 30);
      for (const [i, color] of [[0, "--violet"], [1, "--pink"]]) {
        ctx.strokeStyle = css(color); ctx.lineWidth = 2; ctx.beginPath();
        this.history.forEach((h, k) => {
          const x = 40 + k * (W - 70) / n, y = mid - h[i] * (bot - top) / 2;
          k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        ctx.stroke();
      }
    },
  },

  remember: {
    title: "Remember me",
    goal: "Store at least 3 memories and pass a recall test. Then keep storing until recall breaks.",
    intro: "The hippocampus can store a memory in one go and recall the whole thing from a fragment. A Hopfield " +
      "network does the same. Storing a pattern strengthens the connections between neurons that are active " +
      "together; recall lets the network settle into the nearest stored pattern. Here 64 neurons form an 8 × 8 " +
      "grid. Click and drag on the grid to draw.",
    debrief: "Recall settles into an attractor: the stored pattern closest to the cue. Capacity is limited. Random " +
      "patterns start to interfere at about 0.14 × N, about 9 for 64 neurons, and similar patterns, like hand " +
      "drawings, interfere sooner. Modern Hopfield networks raise capacity sharply and are mathematically close to " +
      "attention.",
    kb: ["function/memory-systems.md", "memory systems"],

    paint(x, y, first) {

      if (col < 0 || col > 7 || row < 0 || row > 7 || this.recallSteps) return;

      const stable = next.every((v, i) => v === this.state[i]);

        this.recallSteps = 0; this.completed = true;
        const best = Math.max(...this.patterns.map(m => m.reduce((sum, v, i) => sum + v * next[i], 0) / 64));

  pattern: {
    title: "Find the pattern",
    tag: ["Hypothesis", "Hebbian plasticity and synaptic normalisation are observed at real synapses. Oja's rule " +
      "is a mathematical model of the pair, not a measured rule."],
    goal: "Line the neuron's weights up with the main direction of its inputs, and keep their length near 1.",
    intro: "Hebb's rule: neurons that fire together wire together. A synapse grows each time its input and the " +
      "neuron's output are active at once. Applied alone it has a flaw: strong synapses make the output bigger, " +
      "which makes them grow faster still. This neuron has two input synapses. Each dot is one input it sees, and " +
      "the arrow is its weights. Feed it inputs, set the learning rate, and decide whether to switch on Oja's " +
      "forgetting term.",
    debrief: "Pure Hebb finds the right direction but its weights run away. Oja's term, −y²w, makes each synapse " +
      "forget in proportion to the output, which holds the weight length at 1. What is left is the first principal " +
      "component: the direction the inputs vary most along. A neuron learned PCA from local information only (Oja " +
      "1982). Stack many such neurons with a little competition and you get sparse coding, the leading model of how " +
      "V1 cells learn edge detectors.",
    kb: ["learning/brain-inspired-learning-algorithms.md", "brain-inspired learning algorithms"],
    hint: "Pure Hebb always runs away. Switch on Oja's term and keep the learning rate low.",
    label: "A scatter of the inputs the neuron sees and an arrow for its two synaptic weights.",
    buttons: [["Oja's forgetting term (−y²w)", null, s => s.toggleOja()], ["Feed inputs (Space)", "Space", s => s.toggle()],
              ["Reset weights", null, s => { s.w = [0.4, -0.3]; s.streak = 0; }]],
    CX: 230, CY: 220, DOT: 40, ARROW: 120, HOLD: 100, LIMIT: 4,   // px per input unit, px per weight unit
    controls() { return slider("rate", "Learning rate", 1, 50, 1, 10); },
    btn(i) { return $("controls").querySelectorAll("button")[i]; },
    reset() {
      this.oja ||= py.runPython("import numpy as np, sim\nlambda w, x, r, d: sim.oja_step(np.array(w), np.array(x), r, d)");
      if (!this.L) {   // Cholesky factor of sim.OJA_COV, to draw inputs with that covariance
        const [[a, b], [, c]] = js(sim.OJA_COV).map(r => Array.from(r)), l0 = Math.sqrt(a), l1 = b / l0;
        this.L = [l0, l1, Math.sqrt(c - l1 * l1)];
      }
      Object.assign(this, { w: [0.4, -0.3], samples: 0, streak: 0, running: false, ranAway: false, decay: false,
                            recent: [], note: "" });
      $("rate").value = 10;
      this.btn(0).setAttribute("aria-pressed", "false"); this.btn(1).textContent = "Feed inputs (Space)";
      say("Press Feed to start.");
    },
    canvasClick() {},
    toggleOja() { this.decay = !this.decay; this.btn(0).setAttribute("aria-pressed", this.decay); },
    toggle() { this.running = !this.running; this.btn(1).textContent = this.running ? "Pause (Space)" : "Feed inputs (Space)"; },
    align() { const p = py.toPy(this.w), a = sim.alignment(p); p.destroy(); return a; },
    learn(n) {
      const rate = $("rate").value / 1000;
      for (let k = 0; k < n; k++) {
        const z = gauss(), x = [this.L[0] * z, this.L[1] * z + this.L[2] * gauss()];
        this.recent.push(x);
        const pw = py.toPy(this.w), px = py.toPy(x);
        this.w = js(this.oja(pw, px, rate, this.decay)); pw.destroy(); px.destroy();
        this.samples += 1;
        const norm = Math.hypot(...this.w);
        if (!this.w.every(Number.isFinite) || norm > this.LIMIT) {
          Object.assign(this, { ranAway: true, w: [0.4, -0.3], streak: 0 });
          this.note = `\n\nRunaway at input ${this.samples}: the weights grew without limit and were reset. ` +
            "Strong synapses made the output bigger, which made them grow faster.";
          break;
        }
        this.streak = this.align() > 0.98 && Math.abs(norm - 1) < 0.1 ? this.streak + 1 : 0;
      }
      this.recent = this.recent.slice(-200);
      return this.streak >= this.HOLD;
    },
    tick() {
      if (!this.running) return;
      const done = this.learn(2);
      const msg = `Direction match  ${pct(this.align())}  (goal 98%)\nWeight length  ${Math.hypot(...this.w).toFixed(2)}  ` +
        `(goal 0.9 to 1.1)\nInputs  ${this.samples}`;
      if (done) return end(`Won. ${stars(1 + this.ranAway + (this.samples <= 300))}\n\n${msg}`, true);
      say(msg + this.note);
    },
    draw() {
      for (const [x, y] of this.recent) {
        const px = this.CX + x * this.DOT, py_ = this.CY - y * this.DOT;
        if (px > 0 && px < W && py_ > 0 && py_ < H) circle(px, py_, 2, "--pink");
      }
      circle(this.CX, this.CY, this.ARROW, null, "--muted", 1, [2, 4]);
      text("|w| = 1", this.CX + this.ARROW * 0.72, this.CY - this.ARROW * 0.72 - 12, "center", "--muted", 12);
      text("dots: inputs the neuron sees     arrow: its two synaptic weights", 20, 20, "left", "--muted", 12);
      arrow(this.CX, this.CY, this.CX + this.w[0] * this.ARROW, this.CY - this.w[1] * this.ARROW, "--violet", 4);
    },
  },

    kb: ["simulation/levels-of-brain-modeling.md", "levels of brain modeling"],
    hint: "Keep a at 0.02: c -55 with d 4 bursts once, c -50 with d 2 chatters. Fast spiking needs a near 0.1.",
    label: "Voltage traces of a leaky integrate-and-fire neuron (top) and an Izhikevich neuron (bottom) under the same current.",
    buttons: [["Run 300 ms (Space)", "Space", s => s.run()]],
    TOP: 130, BOTTOM: 330, LEFT: 40,   // y of the two traces' resting lines, x of their start
    TARGETS: ["regular spiking", "intrinsically bursting", "chattering", "fast spiking"],
    SLIDERS: [["current", 0, 20, 1, 10], ["a", 0.01, 0.12, 0.01, 0.02], ["c (mV)", -70, -45, 1, -65], ["d", 0, 10, 1, 8]],
    controls() { return this.SLIDERS.flatMap(([name, ...range], i) => slider(`zoo${i}`, name, ...range)); },
    reset() {
      Object.assign(this, { found: new Set(), runs: 0, traces: null });
      this.SLIDERS.forEach(([, , , , v], i) => { $(`zoo${i}`).value = v; });
      say("Found  none yet\n\nSet a, c and d, then press Run.");
    },
    canvasClick() {},
    // sim returns (spike times, voltage trace); name the pattern before freeing the proxies.
    trace(p) { const s = p.get(0), kind = sim.firing_pattern(s), v = js(p.get(1)); p.destroy(); return [js(s), v, kind]; },
    run() {
      const [I, a, c, d] = this.SLIDERS.map((_, i) => +$(`zoo${i}`).value);
      this.runs += 1;
      this.traces = [this.trace(sim.lif_run(I)), this.trace(sim.izhikevich(a, 0.2, c, d, I))];
      const kind = this.traces[1][2];
      if (this.TARGETS.includes(kind)) this.found.add(kind);
      const msg = `Izhikevich  ${kind}\nLIF  ${this.traces[0][2]}\n\nFound  ` +
        (this.TARGETS.filter(t => this.found.has(t)).join(", ") || "none yet") + `\nRuns  ${this.runs}`;
      if (this.found.size === this.TARGETS.length) return end(`Won. ${stars(1 + (this.runs <= 8) + (this.runs <= 5))}\n\n${msg}`, true);
      say(msg);
    },
    tick() {},
    draw() {
      const span = W - this.LEFT - 20;
      for (let ms = 0; ms <= sim.ZOO_T; ms += 100) text(`${ms} ms`, this.LEFT + ms / sim.ZOO_T * span, H - 14, "center", "--muted", 12);
      if (!this.traces) return;
      [[this.TOP, "leaky integrate-and-fire"], [this.BOTTOM, "Izhikevich"]].forEach(([y0, label], k) => {
        const [spikes, v, kind] = this.traces[k];
        text(`${label}:  ${kind}`, this.LEFT, y0 - 100, "left", "--ink", 15);
        ctx.strokeStyle = css("--violet"); ctx.lineWidth = 2; ctx.beginPath();
        v.forEach((mv, i) => {
          const x = this.LEFT + i * span / v.length, y = y0 - (mv + 70) * 0.8;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        ctx.stroke();
        for (const t of spikes) { const x = this.LEFT + t / sim.ZOO_T * span; line(x, y0 + 22, x, y0 + 34, "--pink", 2); }
      });
    },
  },

  home: {
    title: "Find your way home",
    tag: ["Hypothesis", "Place, grid and head-direction cells are measured. That grid cells do the brain's path " +
      "integration is the leading theory, not settled."],
    goal: "Find the hidden food, then head home in one straight line and land on the nest.",
    intro: "Your brain keeps a map. Place cells in the hippocampus fire at one spot each; grid cells next door fire " +
      "on a hexagonal lattice that tiles the whole room, like graph paper. By adding up its own steps (path " +
      "integration) an animal knows where it is even in the dark, and can run straight home along a path it never " +
      "took. Arrow keys move the creature (pink). The ring is where it thinks it is. Each step is sensed with a " +
      "little noise. The circles around the three posts are landmark place fields.",
    debrief: "Adding up noisy steps drifts: the error grows the farther you walk. A landmark you recognise snaps the " +
      "estimate back, which is why place fields anchor to visible cues. The straight run home was a shortcut you " +
      "never walked: the home vector came from the map, not from memory of the route. Desert ants do this with no " +
      "landmarks over tens of metres (Müller and Wehner 1988), and an AI agent trained to path-integrate grew " +
      "grid-like units on its own (Banino et al. 2018).",
    kb: ["function/spatial-navigation.md", "spatial navigation"],
    hint: "After you find the food, walk through a post's circle so your estimate resets, then press H at once.",
    label: "An arena seen from above with the nest, three landmark posts and the creature. Arrow keys move it; H heads home.",
    buttons: [["Landmark correction (place cells)", null, s => s.toggle()], ["Head home (H)", "KeyH", s => s.goHome()]],
    STEP: 0.03, FOUND_R: 0.06, HOME_R: 0.08, FAR: 0.4,   // FAR: H only works this far from the nest
    AX: 30, AY: 20, SIDE: 400,
    FOOD_SPOTS: [[0.9, 0.55], [0.55, 0.92], [0.92, 0.92], [0.6, 0.55]],
    px(x, y) { return [this.AX + x * this.SIDE, this.AY + (1 - y) * this.SIDE]; },
    reset() {
      if (this.nav) this.nav.destroy();
      // One grid cell's firing map (40 × 40, column by column from the top), drawn as the arena's background.
      this.grid ||= js(py.runPython("import sim\n[[sim.grid_rate(((i + .5) / 40, 1 - (j + .5) / 40)) " +
                                    "for j in range(40)] for i in range(40)]"));
      this.nest ||= js(sim.NEST); this.posts ||= js(sim.LANDMARKS);
      Object.assign(this, { nav: sim.Navigator(), food: this.FOOD_SPOTS[Math.floor(Math.random() * 4)], found: false,
                            fixed: false, landmarks: true, trail: [this.nest], est: this.nest, run: null });
      $("controls").children[0].setAttribute("aria-pressed", "true");
      say("Use the arrow keys to search for food.");
    },
    canvasClick() {},
    toggle() { this.landmarks = !this.landmarks; $("controls").children[0].setAttribute("aria-pressed", this.landmarks); },
    key(e) {
      const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.key];
      if (d) { e.preventDefault(); this.move(...d); }
    },
    move(dx, dy) {
      this.nav.landmarks = this.landmarks;
      const drift = this.nav.error(), reset = this.nav.move(dx * this.STEP, dy * this.STEP);
      this.fixed ||= reset && this.found && drift > 0.05;   // a landmark fixed real drift on the way home
      const at = js(this.nav.true), est = this.nav.est;
      this.trail.push(at);
      this.found ||= Math.hypot(at[0] - this.food[0], at[1] - this.food[1]) < this.FOUND_R;
      let msg = this.found ? "Food found. Now press H to run straight home." : "Searching for food.";
      msg += `\n\nEstimate is off by ${this.nav.error().toFixed(2)}\nWalked ${this.nav.travelled.toFixed(1)} arena widths` +
        `\nGrid cell firing at your estimate  ${pct(sim.grid_rate(est))}`;
      this.est = js(est);
      if (reset) msg += "\n\nA landmark's place cells reset your position.";
      say(msg);
    },
    goHome() {
      if (!this.found) return say("Find the food first, then head home.");
      const start = this.trail.at(-1), drift = this.nav.error();
      const straight = Math.hypot(start[0] - this.nest[0], start[1] - this.nest[1]);
      if (straight < this.FAR) {
        return say("You can nearly see the nest from here. Head home from farther out, where only your map knows the way.");
      }
      const miss = this.nav.home(), travelled = this.nav.travelled;
      Object.assign(this, { run: [start, js(this.nav.true)], est: this.nest });
      const msg = `Missed the nest by ${miss.toFixed(2)}. Your estimate was off by ${drift.toFixed(2)} when you set out.`;
      if (miss >= this.HOME_R) return end(msg);
      end(`Won. ${stars(1 + (travelled >= 3 * straight) + this.fixed)}\n\nHome. Your route out was ` +
          `${travelled.toFixed(1)} arena widths; the way back was ${straight.toFixed(2)}.\n${msg}`, true);
    },
    tick() {},
    draw() {
      const cell = this.SIDE / 40, r = sim.PLACE_R * this.SIDE;
      ctx.fillStyle = css("--lilac");   // alpha over glass = levels.py mix(GLASS, LILAC, rate)
      this.grid.forEach((col, i) => col.forEach((rate, j) => {
        ctx.globalAlpha = rate; ctx.fillRect(this.AX + i * cell, this.AY + j * cell, cell + 0.5, cell + 0.5);
      }));
      ctx.globalAlpha = 1;
      ctx.strokeStyle = css("--muted"); ctx.lineWidth = 2; ctx.strokeRect(this.AX, this.AY, this.SIDE, this.SIDE);
      for (const [lx, ly] of this.posts) {
        const [x, y] = this.px(lx, ly);
        circle(x, y, r, null, "--violet", 1, [4, 3]);
        ctx.fillStyle = css("--ink"); ctx.fillRect(x - 5, y - 5, 10, 10);
      }
      const [nx, ny] = this.px(...this.nest);
      ctx.globalAlpha = 0.25; circle(nx, ny, this.HOME_R * this.SIDE, "--pink"); ctx.globalAlpha = 1;
      circle(nx, ny, this.HOME_R * this.SIDE, null, "--pink");
      text("nest", nx, ny, "center", "--ink", 12);
      if (this.found) circle(...this.px(...this.food), 9, "--ink");
      ["pink dot: where it is", "ring: where it thinks it is", "squares: landmark posts",
       "dashed circles: their place fields", "shading: one grid cell's firing fields"]
        .forEach((s, k) => text(s, 450, 40 + k * 22, "left", "--muted", 12));
      ctx.strokeStyle = css("--pink"); ctx.lineWidth = 2; ctx.beginPath();
      this.trail.forEach((p, k) => k ? ctx.lineTo(...this.px(...p)) : ctx.moveTo(...this.px(...p)));
      ctx.stroke();
      if (this.run) arrow(...this.px(...this.run[0]), ...this.px(...this.run[1]), "--violet", 3, [8, 4]);
      circle(...this.px(...(this.run ? this.run[1] : this.trail.at(-1))), 6, "--pink");
      circle(...this.px(...this.est), 12, null, "--violet", 3);
    },
  },
};

function render() {
  ctx.fillStyle = css("--glass"); ctx.fillRect(0, 0, W, H);
  level.draw();
}

function start() {
  over = false; clearTimeout(hintTimer);
  $("again").hidden = true; $("debrief").hidden = true; $("hint").hidden = true;
  for (const b of $("controls").children) b.disabled = false;
  level.reset();
  hintTimer = setTimeout(() => { $("hint").hidden = false; }, HINT_AFTER_MS);
  render();
}

function open() {
  const id = location.hash.slice(1);
  level = LEVELS[id] || LEVELS.spark;
  document.title = `Brain Lab: ${level.title}`;
  for (const a of document.querySelectorAll("nav a")) a.toggleAttribute("aria-current", a.hash === `#${id || "spark"}`);
  $("title").textContent = level.title;
  const [tag, note] = level.tag || ["Established", ""];
  $("tag").replaceChildren(Object.assign(document.createElement("b"), { textContent: tag }), note && `  ${note}`);
  $("slide").style.touchAction = level.paint ? "none" : "";  // let a finger draw instead of scroll
  $("intro").textContent = level.intro;
  $("goal").textContent = level.goal;
  $("hint").textContent = `Hint: ${level.hint}`;
  $("slide").setAttribute("aria-label", level.label);
  $("debrief").textContent = `${level.debrief} Read more: `;
  const a = document.createElement("a");
  a.href = `../../${level.kb[0]}`; a.textContent = level.kb[1]; $("debrief").append(a, ".");
  $("controls").replaceChildren(...(level.controls ? level.controls() : []), ...level.buttons.map(([label, , act]) => {
    const b = document.createElement("button");
    b.textContent = label; b.disabled = !sim; b.onclick = () => { if (!over) act(level); };
    return b;
  }));
  if (sim) start(); else say("Loading the model (a few seconds the first time)…");
}

async function main() {
  open();
  window.addEventListener("hashchange", open);
  try {
    py = await loadPyodide();
    await py.loadPackage("numpy");
    const src = await fetch("../sim.py");
    if (!src.ok) throw new Error(`could not fetch game/sim.py (HTTP ${src.status})`);
    py.FS.writeFile("sim.py", await src.text());
    sim = py.pyimport("sim");
  } catch (e) {
    $("controls").firstChild.textContent = "Model failed to load";
    say(`${e.message}. Serve the repo over HTTP (python -m http.server from the repo root) and open /game/web/.`);
    return;
  }
  $("again").onclick = start;
  const at = e => {
    const r = e.currentTarget.getBoundingClientRect();
    return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
  };
  $("slide").onclick = e => { if (!over) level.canvasClick(...at(e)); };
  $("slide").onpointerdown = e => { if (!over && level.paint) level.paint(...at(e), true); };
  $("slide").onpointermove = e => { if (!over && level.paint && e.buttons) level.paint(...at(e), false); };
  document.addEventListener("keydown", e => {
    // Also when a button has focus, so Space fires the output rather than re-pressing that button.
    // Once the level is over, Space falls through to activate a focused "Try again".
    const hit = level.buttons.find(([, code]) => code === e.code);
    if (hit && !over) { e.preventDefault(); if (!e.repeat) hit[2](level); }
    else if (!over && level.key) level.key(e);
  });
  open();  // again, now that levels can build their buttons from sim
  setInterval(() => { if (!over) { level.tick(); render(); } }, TICK_MS);
}
main();
</script>
</body>
</html>
