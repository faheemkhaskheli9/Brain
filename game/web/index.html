<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Lab</title>
<style>
  /* Palette from game/levels.py: a stained histology slide (glass, cresyl violet, eosin pink) */
  :root { --glass: #F7F2F6; --lilac: #E6DCEE; --muted: #6F6890; --violet: #5B3A8C; --pink: #D9637E; --ink: #2A2550; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--glass); color: var(--ink);
         font: 16px/1.5 Bahnschrift, "DIN Alternate", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px; }
  nav { display: flex; gap: 8px; margin: 0 0 16px; }
  nav a { padding: 4px 10px; text-decoration: none; background: var(--lilac); }
  nav a[aria-current] { background: var(--violet); color: var(--glass); }
  h1 { font-weight: 600; font-size: 1.75rem; margin: 0 0 4px; }
  .intro { font-family: Cambria, Georgia, serif; line-height: 1.6; max-width: 68ch; margin: 0 0 20px; }
  .play { display: flex; gap: 20px; flex-wrap: wrap; }
  canvas { flex: 1 1 520px; width: 100%; max-width: 660px; aspect-ratio: 3 / 2; border: 1px solid var(--lilac);
           background: var(--glass); cursor: crosshair; touch-action: manipulation; }
  aside { flex: 0 1 270px; }
  .goal { font-weight: 600; }
  #status { white-space: pre-line; min-height: 5.5em; }
  #hint { color: var(--violet); font-size: .875rem; }
  button { font: inherit; color: var(--ink); background: var(--lilac); border: 0; padding: 8px 14px; margin: 4px 0;
           cursor: pointer; width: 100%; }
  button:hover, button:focus-visible { background: var(--violet); color: var(--glass); }
  button:focus-visible, canvas:focus-visible, nav a:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: wait; }
  .debrief { font-family: Cambria, Georgia, serif; line-height: 1.6; max-width: 68ch; }
  a { color: var(--violet); }
</style>
</head>
<body>
<main>
  <nav aria-label="Levels"><a href="#spark">1 Spark</a><a href="#wire">2 Wire together</a><a href="#lesion">3 Lesion lab</a><a href="#dopamine">4 Be the dopamine</a></nav>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>
  <div class="play">
    <canvas id="slide" width="660" height="440" tabindex="0"></canvas>
    <aside>
      <p class="goal" id="goal"></p>
      <div id="controls"><button disabled>Loading the model…</button></div>
      <button id="again" hidden>Try again</button>
      <p id="status" role="status"></p>
      <p id="hint" hidden></p>
    </aside>
  </div>
  <p class="debrief" id="debrief" hidden></p>
</main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
// Brain Lab levels 1 to 4 in the browser. The models are game/sim.py, run by Pyodide;
// this file only mirrors each levels.py class's text, clock, drawing and win check.
const W = 660, H = 440, TICK_MS = 20, HINT_AFTER_MS = 45000;
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const $ = id => document.getElementById(id);
const ctx = $("slide").getContext("2d");
const font = px => `${px}px Bahnschrift, system-ui, sans-serif`;
let sim, level, over, hintTimer;

function text(s, x, y, align = "center", color = "--muted", px = 13) {
  ctx.font = font(px); ctx.fillStyle = css(color); ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.fillText(s, x, y);
}
function line(x1, y1, x2, y2, color, width = 1, dash = []) {
  ctx.strokeStyle = css(color); ctx.lineWidth = width; ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
}
function say(s) { $("status").textContent = s; }
const stars = n => "★".repeat(n) + "☆".repeat(3 - n);

function end(msg, won) {
  over = true; clearTimeout(hintTimer); $("again").hidden = false;
  for (const b of $("controls").children) b.disabled = true;
  say(msg); render();
  if (won) $("debrief").hidden = false; else $("hint").hidden = false;
}

const LEVELS = {
  spark: {
    title: "Spark",
    goal: "Fire exactly 5 spikes before the 500 ms window ends.",
    intro: "A neuron adds up the charge that flows onto its membrane. When the voltage reaches threshold it fires " +
      "a spike, drops below its resting level and is silent for a moment. Charge also leaks away, so input that " +
      "arrives slowly never adds up. Each click (or Space) sends a 10 ms pulse of current into this model neuron. " +
      "Time runs 20 times slower than real so you can watch it.",
    debrief: "You used temporal summation: pulses that arrive close together add up before the leak drains them " +
      "away. Too many in a row and the neuron keeps firing. This is the leaky integrate-and-fire model, the " +
      "workhorse of spiking simulations. Real neurons add ion-channel detail (Hodgkin-Huxley), but threshold, " +
      "leak and reset are the core.",
    kb: ["simulation/spiking-neural-networks.md", "spiking neural networks"],
    hint: "One click stays below threshold. Two quick clicks fire one spike, so send 5 pairs spread out.",
    label: "Membrane voltage plot. Click or press Space to inject current.",
    buttons: [["Inject current (Space)", "Space", s => s.click()]],
    WINDOW: 500,
    x(ms) { return 60 + ms * (W - 110) / this.WINDOW; },
    y(v) { return H - 50 - (v + 80) * (H - 100) / 45; },
    reset() {
      Object.assign(this, { neuron: sim.LIF(), t: 0, pulses: [], clicks: 0, spikes: 0, points: [[0, sim.V_REST]] });
      say("Waiting for your first click.");
    },
    canvasClick() { this.click(); },
    click() { this.pulses.push(10); this.clicks += 1; },
    tick() {
      if (!this.clicks) return;
      const current = 2.0 * this.pulses.length;
      this.pulses = this.pulses.filter(p => p > 1).map(p => p - 1);
      this.t += 1;
      if (this.neuron.step(current, 1.0)) { this.spikes += 1; this.points.push([this.t, -40]); }
      this.points.push([this.t, this.neuron.v]);
      say(`Spikes  ${this.spikes} of 5\nClicks  ${this.clicks}\nTime  ${this.t} ms`);
      if (this.spikes > 5) {
        end(`${this.spikes} spikes. While the current stays high the neuron keeps firing, so stop clicking once you are close.`);
      } else if (this.t >= this.WINDOW) {
        if (this.spikes === 5) {
          end(`Won: 5 spikes from ${this.clicks} clicks. ${stars(this.clicks <= 10 ? 3 : this.clicks <= 15 ? 2 : 1)}`, true);
        } else {
          end(`${this.spikes} spikes. Click in quick bursts: pulses close together add up before the charge leaks away.`);
        }
      }
    },
    draw() {
      for (const [v, label, dash] of [[sim.V_TH, "threshold  -55 mV", [6, 4]], [sim.V_REST, "rest  -70 mV", [2, 4]]]) {
        line(60, this.y(v), W - 20, this.y(v), "--muted", 1, dash);
        text(label, W - 20, this.y(v) - 10, "right");
      }
      for (let ms = 0; ms <= this.WINDOW; ms += 100) text(`${ms} ms`, this.x(ms), H - 22);
      text("Click anywhere on the slide to inject current", W / 2, 24, "center", "--muted", 15);
      ctx.strokeStyle = css("--violet"); ctx.lineWidth = 2; ctx.beginPath();
      this.points.forEach(([t, v], i) => i ? ctx.lineTo(this.x(t), this.y(v)) : ctx.moveTo(this.x(t), this.y(v)));
      ctx.stroke();
      for (const [t, v] of this.points) if (v === -40) line(this.x(t), this.y(sim.V_TH), this.x(t), this.y(-40), "--pink", 4);
    },
  },

  wire: {
    title: "Wire together",
    goal: "Make synapse A stronger than 0.8 and synapse B weaker than 0.2.",
    intro: "Synapses change strength with use. In spike-timing-dependent plasticity (STDP), timing decides the " +
      "direction. An input that fires just before the output neuron gets stronger; one that fires just after gets " +
      "weaker. The window is about 20 ms. You are the experimenter. Press A or B to fire an input and Space to " +
      "make the output neuron fire. Time runs 10 times slower than real.",
    debrief: "Pre before post strengthens, because the input may have caused the spike. Post before pre weakens. " +
      "Both inputs share one output neuron, so a badly timed output spike changes both synapses at once. STDP lets " +
      "neurons learn causal order and pick up repeating patterns without a teacher (Markram et al. 1997; Bi and " +
      "Poo 1998).",
    kb: ["function/learning-and-plasticity.md", "learning and plasticity"],
    hint: "Repeat A, then Space, then B, all quickly, and wait a second between rounds so the traces fade.",
    label: "Spike raster of inputs A, B and the output, with bars for the two synapse strengths. Press A, B or Space.",
    buttons: [["Fire input A (A)", "KeyA", s => s.fire(0)], ["Fire input B (B)", "KeyB", s => s.fire(1)],
              ["Fire output (Space)", "Space", s => s.fire(2)]],
    DT: 2.0, SPAN: 400.0,  // model ms per tick, ms shown on the raster
    ROWS: [["Input A", 90], ["Input B", 170], ["Output", 250]],
    wy: w => 360 - w * 300,
    weights() { const p = this.syn.w, w = Array.from(p.toJs()); p.destroy(); return w; },
    reset() {
      if (this.syn) this.syn.destroy();
      Object.assign(this, { syn: sim.STDP(2), t: 0, events: [], presses: 0 });
      say("A 0.50   B 0.50\n\nFire an input, then the output a moment later.");
    },
    canvasClick() {},
    fire(who) {
      const before = this.weights();
      who === 2 ? this.syn.post() : this.syn.pre(who);
      this.events.push([this.t, who]);
      this.presses += 1;
      const [a, b] = this.weights();
      const changes = [a, b].map((w, i) => [("AB")[i], w - before[i]]).filter(([, d]) => Math.abs(d) >= 0.005)
        .map(([n, d]) => `${n} ${d >= 0 ? "+" : ""}${d.toFixed(2)}`).join(", ");
      const msg = `A ${a.toFixed(2)}   B ${b.toFixed(2)}\n\nLast spike: ${changes || "no change (nothing within ~20 ms)"}\nPresses ${this.presses}`;
      say(msg);
      if (a > 0.8 && b < 0.2) {
        end(`Won in ${this.presses} presses. ${stars(this.presses <= 14 ? 3 : this.presses <= 24 ? 2 : 1)}\n\n${msg}`, true);
      }
    },
    tick() { this.t += this.DT; this.syn.decay(this.DT); },
    draw() {
      const x = t => 470 - (this.t - t) * 370 / this.SPAN;
      ctx.fillStyle = css("--lilac");
      for (const [t, who] of this.events) if (who === 2 && this.t - t <= this.SPAN) ctx.fillRect(x(t - 20), 70, 20 * 370 / this.SPAN, 120);
      for (const [label, y] of this.ROWS) { text(label, 20, y, "left", "--ink", 15); line(100, y, 470, y, "--lilac"); }
      for (const [t, who] of this.events) {
        if (this.t - t > this.SPAN) continue;
        const y = this.ROWS[who][1];
        line(x(t), y - 18, x(t), y + 18, who === 2 ? "--pink" : "--violet", 3);
      }
      text(`last ${this.SPAN} ms, newest on the right`, 285, 300);
      text("Shaded band: the 20 ms before each output spike. Inputs inside it get stronger.", 285, 330, "center", "--muted", 12);
      const w = this.weights();
      [540, 610].forEach((xc, i) => {
        ctx.fillStyle = css("--violet"); ctx.fillRect(xc - 17, this.wy(w[i]), 34, 359 - this.wy(w[i]));
        ctx.strokeStyle = css("--muted"); ctx.lineWidth = 1; ctx.strokeRect(xc - 18, 60, 36, 300);
        text("AB"[i], xc, 380, "center", "--ink", 16);
      });
      line(510, this.wy(0.8), 640, this.wy(0.8), "--violet", 1, [4, 3]);
      line(510, this.wy(0.2), 640, this.wy(0.2), "--pink", 1, [4, 3]);
      text("synapse strength", 575, 40);
    },
  },

  lesion: {
    title: "Lesion lab",
    goal: "Lesion each hidden region and name it from what breaks. At most 3 wrong names.",
    intro: "Much of what we know about brain regions comes from damage. When a stroke, an injury or surgery takes " +
      "out one part, the behaviour that breaks shows what that part was doing. This brain does 8 jobs. Its regions " +
      "are hidden. Click a region (or press its number, 1 to 8) to lesion it and watch which job fails, then name " +
      "the region. Lesioning another region heals the first one.",
    debrief: "Each lesion took out one kind of learner. Losing the hippocampus stops new episodes but spares old " +
      "memories, because those have moved to the cortex. Losing the basal ganglia stops habits forming while the " +
      "memory of practising survives: two memory systems, broken separately. A brain-like AI would need several " +
      "kinds of learner, not one big network.",
    kb: ["anatomy/brain-structure-overview.md", "brain structure overview"],
    hint: "Match the broken job to a role: memory of places is the hippocampus, fear is the amygdala, timing is the cerebellum.",
    label: "A brain with 8 hidden regions, numbered 1 to 8. Click one or press its number to lesion it.",
    // Each entry of sim.REGIONS: [[x, y], job, role, deficit, evidence]. Name buttons are shuffled, as on desktop.
    get buttons() {
      if (!sim) return [["Loading the model…", null, () => {}]];
      this.R = this.R || sim.REGIONS.toJs();
      return [...this.R.keys()].sort(() => Math.random() - 0.5).map(n => [n, null, s => s.name(n)]);
    },
    reset() {
      Object.assign(this, { cut: null, named: new Set(), mistakes: 0 });
      say("Click a hidden region on the slide to lesion it.");
    },
    hit(x, y) { return [...this.R].find(([, [[cx, cy]]]) => Math.abs(x - cx) <= 80 && Math.abs(y - cy) <= 17)?.[0]; },
    canvasClick(x, y) { const n = this.hit(x, y); if (n) this.lesion(n); },
    key(e) { const k = +e.key; if (k >= 1 && k <= this.R.size) this.lesion([...this.R.keys()][k - 1]); },
    lesion(n) {
      this.cut = n;
      say(`Lesioned.\n\n${this.R.get(n)[3]}` + (this.named.has(n) ? "" : "\n\nWhich region is it?"));
    },
    name(guess) {
      if (this.cut === null || this.named.has(this.cut)) return say("Lesion a region you have not named yet, then pick its name.");
      const cut = this.cut;
      if (guess !== cut) {
        this.mistakes += 1;
        const msg = `Not quite. ${guess} does ${this.R.get(guess)[2]}.\nWrong names ${this.mistakes} of 3`;
        return this.mistakes > 3 ? end(msg) : say(msg);
      }
      this.named.add(cut); this.cut = null;
      for (const b of $("controls").children) if (b.textContent === cut) b.disabled = true;
      const msg = `Yes. ${cut}: ${this.R.get(cut)[2]}.\nEvidence: ${this.R.get(cut)[4]}.`;
      if (this.named.size === this.R.size) return end(`Won. ${stars(3 - Math.min(this.mistakes, 2))}\n\n${msg}`, true);
      say(msg);
    },
    tick() {},
    draw() {
      ctx.fillStyle = css("--lilac"); ctx.strokeStyle = css("--muted"); ctx.lineWidth = 2;
      ctx.fillRect(350, 330, 60, 90); ctx.strokeRect(350, 330, 60, 90);
      ctx.beginPath(); ctx.ellipse(335, 200, 285, 150, 0, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
      text("front", 70, 30, "left", "--muted", 12); text("back", 600, 30, "right", "--muted", 12);
      [...this.R].forEach(([n, [[x, y]]], i) => {
        ctx.fillStyle = css(n === this.cut ? "--pink" : this.named.has(n) ? "--lilac" : "--glass");
        ctx.fillRect(x - 80, y - 17, 160, 34);
        ctx.strokeStyle = css("--violet"); ctx.strokeRect(x - 80, y - 17, 160, 34);
        text(this.named.has(n) ? n : `${i + 1}  ?`, x, y, "center", "--ink", n.length > 20 && this.named.has(n) ? 11 : 13);
      });
      const broken = this.cut && this.R.get(this.cut)[1];
      text(broken ? "7 of 8 jobs work. Broken:" : "All 8 jobs work.", 16, 372, "left", broken ? "--pink" : "--ink", 14);
      if (!broken) return;
      // Wrap at 270 px, as on desktop, so the job stays left of the brainstem box.
      ctx.font = font(13);
      let row = "✗", y = 394;
      for (const w of broken.split(" ")) {
        if (ctx.measureText(`${row} ${w}`).width > 270) { text(row, 16, y, "left", "--pink"); row = w; y += 18; }
        else row += ` ${w}`;
      }
      text(row, 16, y, "left", "--pink");
    },
  },

  dopamine: {
    title: "Be the dopamine",
    goal: "Make the dopamine burst move from the juice to the bell. Then withhold the juice and cause a dip.",
    intro: "Dopamine neurons do not signal reward itself. They signal reward prediction error: a burst when things " +
      "are better than expected, nothing when they are as expected, a dip when they are worse. A temporal-difference " +
      "(TD) learner computes the same signal, δ = r + γV(s′) − V(s). Each button runs one trial. The bars show the " +
      "learner's dopamine at each moment.",
    debrief: "Once the bell predicts the juice, the surprise, and the burst, moves to the bell. Missing juice is worse " +
      "than predicted, so dopamine dips at the moment the juice was due. Juice with no bell is still a surprise. Real " +
      "dopamine neurons do all three (Schultz, Dayan and Montague 1997), one of the strongest links between " +
      "neuroscience and AI.",
    kb: ["function/learning-and-plasticity.md", "learning and plasticity"],
    hint: "Run bell-and-juice trials until the bell bar is tall and the juice bar is gone, then ring with no juice.",
    label: "Bar chart of the learner's dopamine at each moment of the last trial, with a line chart across trials.",
    buttons: [["Ring bell, give juice", null, s => s.trial(true, true)], ["Ring bell, no juice", null, s => s.trial(true, false)],
              ["Juice, no bell", null, s => s.trial(false, true)]],
    ZERO: 160, SCALE: 100, X0: 70, STEP: 52,
    reset() {
      if (this.V) this.V.destroy();
      Object.assign(this, { V: sim.td_values(), trials: 0, learned: false, surprise: false, history: [],
                            d: new Array(sim.T_JUICE + 3).fill(0), bell: null, juice: null });
      say("Run a trial to see the dopamine response.");
    },
    canvasClick() {},
    trial(bell, juice) {
      const p = sim.td_trial(this.V, bell, juice), d = Array.from(p.toJs()); p.destroy();
      Object.assign(this, { d, bell, juice });
      this.trials += 1;
      const db = d[sim.T_BELL], dj = d[sim.T_JUICE], f = v => `${v >= 0 ? "+" : ""}${v.toFixed(2)}`;
      this.history.push([db, dj]);
      let msg = `Trial ${this.trials}\nDopamine at bell  ${f(db)}\nDopamine at juice time  ${f(dj)}`;
      if (bell && juice && db >= 0.8 && dj <= 0.2 && !this.learned) {
        this.learned = true;
        msg += "\n\nThe burst has moved to the bell. Now try a trial without juice.";
      } else if (this.learned && !bell && juice) {
        this.surprise = true;
      }
      if (this.learned && bell && !juice && dj <= -0.5) {
        return end(`Won. ${stars(1 + this.surprise + (this.trials <= 25))}\n\n${msg}\n\nA dip: the predicted juice never came.`, true);
      }
      say(msg);
    },
    tick() {},
    draw() {
      line(40, this.ZERO, W - 30, this.ZERO, "--muted");
      text("dopamine (TD error) this trial", 40, 30, "left", "--muted", 12);
      this.d.forEach((v, t) => {
        if (Math.abs(v) <= 1e-3) return;
        const x = this.X0 + t * this.STEP, y = this.ZERO - v * this.SCALE;
        ctx.fillStyle = css(v > 0 ? "--pink" : "--violet");
        ctx.fillRect(x - 14, Math.min(y, this.ZERO), 28, Math.abs(v) * this.SCALE);
      });
      for (const [t, label, on] of [[sim.T_BELL, "bell", this.bell], [sim.T_JUICE, "juice", this.juice]]) {
        text(label, this.X0 + t * this.STEP, this.ZERO + this.SCALE + 20, "center", on ? "--ink" : "--muted", 15);
      }
      const top = 340, bot = 430, mid = (top + bot) / 2;
      text("across trials:  at bell (violet), at juice time (pink)", 40, top - 14, "left", "--muted", 12);
      line(40, mid, W - 30, mid, "--lilac");
      if (this.history.length < 2) return;
      const n = Math.max(this.history.length - 1, 30);
      for (const [i, color] of [[0, "--violet"], [1, "--pink"]]) {
        ctx.strokeStyle = css(color); ctx.lineWidth = 2; ctx.beginPath();
        this.history.forEach((h, k) => {
          const x = 40 + k * (W - 70) / n, y = mid - h[i] * (bot - top) / 2;
          k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        ctx.stroke();
      }
    },
  },
};

function render() {
  ctx.fillStyle = css("--glass"); ctx.fillRect(0, 0, W, H);
  level.draw();
}

function start() {
  over = false; clearTimeout(hintTimer);
  $("again").hidden = true; $("debrief").hidden = true; $("hint").hidden = true;
  for (const b of $("controls").children) b.disabled = false;
  level.reset();
  hintTimer = setTimeout(() => { $("hint").hidden = false; }, HINT_AFTER_MS);
  render();
}

function open() {
  const id = location.hash.slice(1);
  level = LEVELS[id] || LEVELS.spark;
  document.title = `Brain Lab: ${level.title}`;
  for (const a of document.querySelectorAll("nav a")) a.toggleAttribute("aria-current", a.hash === `#${id || "spark"}`);
  $("title").textContent = level.title;
  $("intro").textContent = level.intro;
  $("goal").textContent = level.goal;
  $("hint").textContent = `Hint: ${level.hint}`;
  $("slide").setAttribute("aria-label", level.label);
  $("debrief").textContent = `${level.debrief} Read more: `;
  const a = document.createElement("a");
  a.href = `../../${level.kb[0]}`; a.textContent = level.kb[1]; $("debrief").append(a, ".");
  $("controls").replaceChildren(...level.buttons.map(([label, , act]) => {
    const b = document.createElement("button");
    b.textContent = label; b.disabled = !sim; b.onclick = () => { if (!over) act(level); };
    return b;
  }));
  if (sim) start(); else say("Loading the model (a few seconds the first time)…");
}

async function main() {
  open();
  window.addEventListener("hashchange", open);
  try {
    const py = await loadPyodide();
    await py.loadPackage("numpy");
    const src = await fetch("../sim.py");
    if (!src.ok) throw new Error(`could not fetch game/sim.py (HTTP ${src.status})`);
    py.FS.writeFile("sim.py", await src.text());
    sim = py.pyimport("sim");
  } catch (e) {
    $("controls").firstChild.textContent = "Model failed to load";
    say(`${e.message}. Serve the repo over HTTP (python -m http.server from the repo root) and open /game/web/.`);
    return;
  }
  $("again").onclick = start;
  $("slide").onclick = e => {
    const r = e.currentTarget.getBoundingClientRect();
    if (!over) level.canvasClick((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
  };
  document.addEventListener("keydown", e => {
    // Also when a button has focus, so Space fires the output rather than re-pressing that button.
    // Once the level is over, Space falls through to activate a focused "Try again".
    const hit = level.buttons.find(([, code]) => code === e.code);
    if (hit && !over) { e.preventDefault(); if (!e.repeat) hit[2](level); }
    else if (!over && level.key) level.key(e);
  });
  open();  // again, now that levels can build their buttons from sim
  setInterval(() => { if (!over) { level.tick(); render(); } }, TICK_MS);
}
main();
</script>
