[project]
name = "brain-kb"
version = "0.1.0"
description = "Knowledge base on the human brain, with runnable models and the Brain Lab game"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-CONTENT.md"]
dependencies = ["numpy"]

[project.optional-dependencies]
# research/credit_assignment.py loads sklearn's bundled 8x8 digits; wm_capacity.py fits with scipy;
# timing_vs_count.py reads NWB files with h5py; microns_clustering.py uses pandas: pip install ".[research]"
research = ["scikit-learn", "scipy", "h5py", "pandas"]
# research/llm_brain_match.py reads Narratives surface data and runs GPT-2: pip install ".[llm-brain]"
llm-brain = ["nibabel", "pyarrow", "torch", "transformers"]

# Not a library: `pip install .` only pulls the dependencies.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120
extend-exclude = ["research/pdfs"]

[tool.ruff.lint]
# Bug-finding rules only; the compact one-line style (E702, E731, E741) is deliberate.
select = ["F", "E9", "B"]
ignore = ["B905"]
