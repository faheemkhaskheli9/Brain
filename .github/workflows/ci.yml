name: CI

# Pull requests run once (not again as a branch push); main runs on every push.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded branch/PR builds; never cancel an in-flight main build.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# CI runs contributor code (topic code blocks), so the token stays read-only.
permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"   # test_result_schema.py replays a sweep fixture through sweep.mjs
      - run: sudo apt-get install -y python3-tk xvfb
      - run: pip install . ruff
      - name: Lint
        run: ruff check .
      - name: Index builder and code-block runner work
        run: python test_build_index.py
      - name: Index is current and links resolve
        run: |
          python build_index.py
          git diff --exit-code INDEX.md
      - name: Paper catalog is current (offline)
        run: python research/fetch_papers.py --check
      - name: Web app write path, backlinks and git routes
        run: python webapp/test_server.py
      - name: Topic code blocks run
        run: python run_code_blocks.py
      - name: Game models
        run: python game/test_sim.py
      - name: Models match published brain data
        run: python game/eval.py
      - name: Every game level can be won (engine, no display)
        run: python game/test_levels.py
      - name: Game level views build and play (Tk)
        run: xvfb-run python game/test_levels_ui.py
      - name: Experiment result files validate and keep failed runs (#104)
        run: python research/test_result_schema.py
      - name: Stateful option science gate rejects missing seeds, leaks and forgetting (#112)
        run: python research/test_analyze_stateful_options.py
      - name: Sparse local synaptic learning, growth/prune and frozen evaluation
        run: |
          python research/test_sparse_brain_tasks.py
          python research/test_structural_plasticity.py
          python research/test_learn_sparse_brain.py
          python research/learn_sparse_brain.py --seeds 1 2 --train-steps 140 --eval-trials 25 --out /tmp/sparse-learning-smoke.json
          python research/result_schema.py --check /tmp/sparse-learning-smoke.json
          python research/result_schema.py --check research/results/structural-plasticity-2026-11-12.json
      - name: Learned sparse motor control and post-action reward regressions
        run: |
          python research/test_closed_loop_reach.py
          python research/test_learn_reach.py
          python research/learn_reach.py --seeds 1 2 --train-episodes 4 --eval-episodes 3 --reverse-episodes 2 --out /tmp/reach-smoke.json
          python research/result_schema.py --check /tmp/reach-smoke.json
          python research/result_schema.py --check research/results/closed-loop-reaching-2026-11-12.json
      - name: Sparse context checkpoint retrieval and adversarial learning controls
        run: |
          python research/test_context_memory.py
          python research/test_evaluate_context_memory.py
          python research/evaluate_context_memory.py --seeds 0 1 --train-episodes 6 --adapt-episodes 4 --eval-episodes 3 --probe-trials 2 --probe-steps 2 --out /tmp/context-memory-smoke.json
          python research/result_schema.py --check /tmp/context-memory-smoke.json
      - name: Results dashboard reports bad files and exports exact values (#107)
        run: python research/test_dashboard.py
      - name: Continual-learning archived results and mutation gates (#154)
        run: python research/test_continual_guard.py
      - name: Replay analysis keeps failures, budgets and paired uncertainty (#152)
        run: python research/test_analyze_replay.py
      - name: Stateful carry evaluator preselects comparators on development only
        run: python research/test_analyze_stateful_carry.py
      - name: LLM verified mistake-learning memory and no-leakage regression tests
        run: python research/test_llm_mistake_learning.py
      - name: Agent mistake-learning stack (skills, RAG, subagents, plugins)
        run: python research/test_agent_learning.py
      - name: Agent learning guide and cross-agent skill parity
        run: python research/test_agent_learning_guides.py
      - name: Claims match their evidence (#117)
        run: python research/test_check_claims.py

  world:
    name: Brain World environment and gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # result_schema.py is stdlib only
      - uses: actions/setup-node@v7
        with:
          node-version: "22"   # 22+ loads ES-module syntax from brain.js without a package.json
      - name: Baselines see what the creature sees, the RL baseline learns (#118)
        run: node game/world/test_env.mjs
      - name: Shared multi-task backprop comparator stays masked and deterministic (#153)
        run: |
          node game/world/test_rl_multitask.mjs
          node game/world/rl_multitask.mjs 1 --budget 20 --episodes 2 --no-controls --out /tmp/rl-multitask-smoke.json
          python research/result_schema.py --check /tmp/rl-multitask-smoke.json
      - name: Held-out splits are disjoint and frozen scoring learns nothing (#105)
        run: node game/world/test_heldout.mjs
      - name: Live frozen-checkpoint behavior and mutation smoke test (#154)
        run: node game/world/test_continual_live.mjs
      - name: Failure-aware replay probabilities and save-load gates (#152)
        run: node game/world/test_prioritized_replay.mjs
      - name: Navigation suite is frozen and its splits are disjoint (#108)
        run: node game/world/test_navigation.mjs
      - name: Construction tasks are deterministic, valid and held out (#110)
        run: node game/world/test_construct.mjs
      - name: Stateful acquire-carry-place environment and matched learning baselines (#112)
        run: |
          node game/world/test_stateful_carry.mjs
          node game/world/test_stateful_baselines.mjs
          node game/world/stateful_baselines.mjs 1 --train-steps 20 --train-tasks 4 --eval-tasks 4 --repeats 1 --out /tmp/stateful-carry-smoke.json
          python research/result_schema.py --check /tmp/stateful-carry-smoke.json
          python research/analyze_stateful_carry.py /tmp/stateful-carry-smoke.json
      - name: Curriculum gait/action scaffold has an opt-out control and paired frozen scenes
        run: node game/world/test_scaffold.mjs
      - name: Stateful construction transitions, disjoint goals and independent oracle (#110/#112)
        run: node game/world/test_stateful_construct.mjs
      - name: Backprop-free stateful option pilot, masking and frozen tests (#112)
        run: |
          node game/world/test_stateful_options.mjs
          node game/world/stateful_options.mjs 1 --train-steps 10 --train-tasks 3 --eval-tasks 3 --repeats 1 --out /tmp/stateful-options-smoke.json
          python research/result_schema.py --check /tmp/stateful-options-smoke.json
      - name: Goal-conditioned construction learner has frozen, masked controls (#112)
        run: |
          node game/world/test_construct_learner.mjs
          node game/world/construct_learner.mjs 1 --train-steps 20 --train-tasks 4 --eval-tasks 4 --repeats 1 --out /tmp/construct-learner-smoke.json
          python research/result_schema.py --check /tmp/construct-learner-smoke.json
      - name: Construction transfer pilot keeps adaptation tasks and tests separate (#112)
        run: |
          node game/world/test_construct_transfer.mjs
          node game/world/construct_transfer.mjs 1 --train-steps 8 --adapt-steps 8 --train-tasks 4 --adapt-tasks 3 --eval-tasks 3 --repeats 1 --out /tmp/construct-transfer-smoke.json
          python research/result_schema.py --check /tmp/construct-transfer-smoke.json
      - name: Novelty scoring rejects invalid, duplicate and mirrored candidates (#111)
        run: node game/world/test_novelty.mjs
      - name: Fair novelty feedback queries are audited (#111)
        run: |
          node game/world/test_novelty_fair.mjs
          node game/world/novelty_fair.mjs 1 --tasks 3 --budget 8 --out /tmp/novelty-fair-smoke.json
          python research/result_schema.py --check /tmp/novelty-fair-smoke.json
      - name: Every species in Brain Ecosystem learns
        run: node game/ecosystem/test_ecosystem.mjs 1 2 3

  creature:
    # One job per seed, so tuning that only helps seed 1 still fails and the seeds run in parallel.
    name: Creature learns every stage and keeps them (seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node game/world/test_brain.mjs ${{ matrix.seed }}

  browser:
    name: Interactive demos work in a browser (#109)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_VERSION: "1.65.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g playwright@$PLAYWRIGHT_VERSION three@0.160.0
      - name: Cache the Chromium download
        id: chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium
      - name: Install Chromium and its system packages
        if: steps.chromium.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium
      - name: Install Chromium's system packages only
        if: steps.chromium.outputs.cache-hit == 'true'
        run: playwright install-deps chromium
      - run: node game/test_browser.mjs

  check:
    # The one status to require on main (#164): green only when every job above is.
    if: always()
    needs: [python, world, creature, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
