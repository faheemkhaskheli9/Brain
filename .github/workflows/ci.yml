name: CI

on: [push, pull_request]

# CI runs contributor code (topic code blocks), so the token stays read-only.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y python3-tk xvfb
      - run: pip install . ruff
      - name: Lint
        run: ruff check .
      - name: Index is current and links resolve
        run: |
          python build_index.py
          git diff --exit-code INDEX.md
      - name: Topic code blocks run
        run: python run_code_blocks.py
      - name: Game models
        run: python game/test_sim.py
      - name: Models match published brain data
        run: python game/eval.py
      - name: Every game level can be won
        run: xvfb-run python game/test_levels.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # 22+ loads ES-module syntax from brain.js without a package.json
      - name: Brain World creature learns every stage and keeps them
        run: node game/world/test_brain.mjs 1 2 3   # several seeds, so tuning that only helps seed 1 fails
      - name: Every species in Brain Ecosystem learns
        run: node game/ecosystem/test_ecosystem.mjs 1 2 3
