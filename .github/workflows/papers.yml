name: Paper catalog

# research/papers.md is built offline from the topics plus research/papers.json, the cache of
# OpenAlex lookups; CI checks it is current with fetch_papers.py --check. This job does the online
# part weekly (or on demand): it looks up references not in the cache yet and opens a pull request
# with the new cache and catalog (#100). Run with "refresh" to look every reference up again.
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      refresh:
        description: "Look every reference up again, not only new ones"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Look up new references and rebuild the catalog
        run: python research/fetch_papers.py --enrich ${{ inputs.refresh && '--refresh' || '' }}
      - name: Open a pull request if it changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/paper-catalog
          commit-message: "research/papers.json, papers.md: look up new references"
          title: "Refresh research/papers.md"
          body: |
            Regenerated by the `Paper catalog` workflow with
            `python research/fetch_papers.py --enrich`. Review the diff for references that
            OpenAlex resolved to the wrong work before merging.
          add-paths: |
            research/papers.json
            research/papers.md
          delete-branch: true
