name: Paper catalog

# research/papers.md resolves every topic reference through api.openalex.org, which CI's checks do
# not call and some dev environments block. This job rebuilds it weekly (or on demand) and opens a
# pull request when it changed, so the catalog cannot silently go stale (#100).
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Rebuild the catalog (no PDFs)
        run: python research/fetch_papers.py --no-pdf
      - name: Open a pull request if it changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/paper-catalog
          commit-message: "research/papers.md: refresh the paper catalog"
          title: "Refresh research/papers.md"
          body: |
            Regenerated by the weekly `Paper catalog` workflow with
            `python research/fetch_papers.py --no-pdf`. Review the diff for references that
            OpenAlex resolved to the wrong work before merging.
          add-paths: research/papers.md
          delete-branch: true
